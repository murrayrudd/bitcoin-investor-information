   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="99.27" y="43.801716" transform="rotate(-0 99.27 43.801716)">Train two procedures</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(40.493828 61.337072)">Independent training banks</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(22.465195 72.146947)">Observation and response functions</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(29.280469 82.956822)">Cutoffs and response allowances</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="294.57" y="43.801716" transform="rotate(-0 294.57 43.801716)">Calibrate and validate</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(224.671445 61.337072)">12 calibration locations per bank</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(241.188672 72.146947)">512 markets per location</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(223.030547 82.956822)">36 preliminary validation settings</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="489.87" y="43.801716" transform="rotate(-0 489.87 43.801716)">Freeze the procedures</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(420.465508 61.337072)">Economic model and summaries</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(416.822461 72.146947)">Functions, cutoffs, and allowances</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(429.932383 82.956822)">Domain and search budgets</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="294.57" y="157.453716" transform="rotate(-0 294.57 157.453716)">Draw 256 parameter settings for the main experiment</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(106.425156 174.989072)">192 primary settings: 144 mixed + 16 belief drift + 16 funding drift + 16 allowance drift</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(111.367773 185.798947)">32 near-face settings and 32 near-corner settings; stress samples reported separately</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="146.7" y="257.245716" transform="rotate(-0 146.7 257.245716)">Construct response intervals</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(74.447344 274.781072)">64 evaluation markets per setting</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(53.688086 285.590947)">4 information designs × 2 fitted procedures</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(69.770352 296.400822)">131,072 intervals across all settings</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(63.724727 307.210697)">98,304 intervals in the primary sample</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="442.44" y="257.245716" transform="rotate(-0 442.44 257.245716)">Estimate independent reference means</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(341.705039 274.781072)">1,024 reference markets per parameter setting</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(330.259258 285.590947)">Paired transfer and control paths within each market</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(333.6825 296.400822)">Mean month-19 response and its Monte Carlo error</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(327.26832 307.210697)">Reference draws are independent of evaluation draws</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="195.525" y="379.213716" transform="rotate(-0 195.525 379.213716)">Compare performance and information gains</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(84.338359 396.749072)">Coverage, empty intervals, and mean interval width</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(64.771758 407.558947)">Paired information contrasts on the same evaluation releases</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(70.276172 418.368822)">2,000 stratified bootstrap resamples of parameter settings</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(84.048828 429.178697)">Uncertainty conditional on the two fitted procedures</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="489.87" y="379.213716" transform="rotate(-0 489.87 379.213716)">Audit fitted endpoints</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(428.170625 396.749072)">Expanded endpoint searches</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(419.403672 407.558947)">144 selected response endpoints</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(422.485586 418.368822)">128 fresh markets per endpoint</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(420.869258 429.178697)">No recalibration after evaluation</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.57" y="469.5696" transform="rotate(-0 15.57 469.5696)">Main-run total: 296,960 simulated markets, including 18,432 endpoint-audit markets.</text>
   </g>
  </g>
 </g>
